<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Orders | JM Ali Admin</title><link rel="stylesheet" href="./css/admin.css"></head>
<body><div class="admin-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">JM</div><div class="brand-text"><strong>JM Ali</strong><span>Admin Panel</span></div></div><nav class="nav-menu" aria-label="Sidebar navigation"><a class="nav-item" href="./index.html">Overview</a><a class="nav-item" href="./products.html">Products</a><a class="nav-item active" href="./orders.html">Orders</a><a class="nav-item" href="./customers.html">Customers</a><a class="nav-item" href="./inventory.html">Inventory</a><a class="nav-item" href="./reports.html">Reports</a><a class="nav-item" href="./settings.html">Settings</a></nav><div class="sidebar-card"><p>Today</p><strong>18</strong><span>Orders processed</span></div></aside><main class="main-panel"><header class="topbar"><div><p class="eyebrow">Fulfilment</p><h1>Orders</h1></div><button id="open-order-form" class="primary-btn" type="button">+ New Order</button></header><section class="panel orders-dashboard"><div class="panel-header"><h2>Order Management</h2><span>Track every customer order</span></div><div class="toolbar-row"><input id="order-search" type="search" placeholder="Search customer or order..." aria-label="Search orders"><select id="order-status-filter" aria-label="Filter orders by status"><option value="All">All statuses</option><option value="Paid">Paid</option><option value="Pending">Pending</option><option value="Shipped">Shipped</option><option value="Cancelled">Cancelled</option></select></div><div class="order-summary-grid"><div class="summary-card success"><span>Paid Orders</span><strong>142</strong></div><div class="summary-card warning"><span>Pending</span><strong>18</strong></div><div class="summary-card info"><span>Shipped</span><strong>96</strong></div><div class="summary-card danger"><span>Cancelled</span><strong>7</strong></div></div><div class="order-table-wrapper"><table class="order-table"><thead><tr><th>Order ID</th><th>Customer</th><th>Items</th><th>Date</th><th>Status</th><th>Total</th><th>Actions</th></tr></thead><tbody id="orders-table-body"></tbody></table></div></section></main></div><div id="order-modal" class="product-modal hidden" aria-hidden="true"><div class="product-modal-content"><div class="modal-header"><h2>Create New Order</h2><button type="button" id="close-order-modal" class="close-modal" aria-label="Close order form">×</button></div><form id="order-form"><div class="product-form-grid"><label>Customer Name<input id="order-customer" type="text" placeholder="Rahim" required></label><label>Order Items<input id="order-items" type="text" placeholder="2 x Mango, 1 x Apple" required></label><label>Order Date<input id="order-date" type="date" required></label><label>Status<select id="order-status" required><option value="Pending">Pending</option><option value="Paid">Paid</option><option value="Shipped">Shipped</option><option value="Cancelled">Cancelled</option></select></label><label>Total Amount<input id="order-total" type="text" placeholder="RM 72.00" required></label></div><div class="modal-actions"><button type="button" id="cancel-order-form" class="ghost-btn">Cancel</button><button type="submit" class="primary-btn">Save Order</button></div></form></div></div><script src="../js/script.js"></script></body>
</html>
